name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Site validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Install locked dependencies
        run: node .yarn/releases/yarn-1.22.22.cjs install --frozen-lockfile --non-interactive

      - name: Lint source and tests
        run: node .yarn/releases/yarn-1.22.22.cjs lint

      # Build includes typechecking and generates the static HTML tested below.
      - name: Build and typecheck
        run: node .yarn/releases/yarn-1.22.22.cjs build

      - name: Test generated site
        run: node .yarn/releases/yarn-1.22.22.cjs test
